<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <meta name="theme-color" content="#f5f0e4">
    <meta name="color-scheme" content="light dark">
    <script>
        (() => {
            let stored;
            try { stored = localStorage.getItem("shibumi-theme"); } catch {}
            const theme = stored === "light" || stored === "dark"
                ? stored
                : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
            document.querySelector('meta[name="theme-color"]')
                ?.setAttribute("content", theme === "dark" ? "#1b130f" : "#f5f0e4");
        })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png">
    <!-- insert:meta -->
    <link rel="stylesheet" href="/shibumi.css?v={{asset-version}}">
    <link rel="stylesheet" href="/shared.css?v={{asset-version}}">
    <!-- insert:page-style -->
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{canonical}}">
</head>
<body>
    <div class="shell">
        <!-- insert:nav -->

        <main>
            <!-- insert:page -->
        </main>

        <!-- insert:footer -->
    </div>
    <script src="/main.js?v={{asset-version}}"></script>
    <!-- insert:page-script -->
</body>
</html>
