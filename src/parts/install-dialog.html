<dialog class="install-dialog" id="install-dialog" aria-labelledby="notify-dialog-title">
  <div class="install-dialog-content">
    <button class="install-dialog-close" type="button" data-dialog-close aria-label="Close create project dialog">{{icon(close)}}</button>
    <div class="install-dialog-head">
      <span class="kanji">渋み</span>
      <span id="notify-dialog-title">Create a Shibumi project</span>
    </div>
    <p class="install-dialog-hint">Run this from the directory that will contain your project.</p>
    <div class="notify-preview">
      <p class="notify-preview-label">Bun</p>
      <div class="install-dialog-command">
        <span class="prompt-mark">›</span>
        <code>bun create shibumi@latest my-app</code>
        <button class="copy-command" type="button" data-copy="bun create shibumi@latest my-app" aria-label="Copy create command">{{icon(copy)}}{{icon(check)}}</button>
      </div>
      <p class="install-dialog-alt">or <code>npm create shibumi@latest my-app</code></p>
    </div>
  </div>
</dialog>
